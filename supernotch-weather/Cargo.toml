[package]
name = "supernotch-weather"
version = "1.0.0"
edition = "2021"
license = "MIT"
description = "SuperNotch weather and clock backend with locally rendered ECMWF IFS maps"

[[bin]]
name = "supernotch-weather"
path = "src/main.rs"

[lib]
name = "supernotchweather"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imageproc = "0.25"
fs2 = "0.4"
jni = "0.21"
jiff = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
